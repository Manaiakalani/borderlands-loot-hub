name: CI

# Validate pull requests before they can be merged. The deploy-pages workflow
# only runs lint/test/build on pushes to main (i.e. *after* merge), so without
# this, broken code can land on main before any check runs.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # One preview server serves both runners. Playwright is configured with
      # reuseExistingServer, and the Puppeteer smoke script expects :4173.
      - name: Start preview server
        run: |
          npm run preview &
          for i in $(seq 1 60); do
            if curl -sfo /dev/null http://localhost:4173/borderlands-loot-hub/; then
              echo "Preview server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Preview server did not start within 60s." >&2
          exit 1

      - name: End-to-end tests (Playwright)
        run: npx playwright test

      - name: End-to-end smoke tests (Puppeteer)
        run: npm run test:e2e:puppeteer

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
