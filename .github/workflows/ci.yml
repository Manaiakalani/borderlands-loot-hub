name: CI

# Validate pull requests before they can be merged. The deploy-pages workflow
# only runs lint/test/build on pushes to main (i.e. *after* merge), so without
# this, broken code can land on main before any check runs.
on:
  pull_request:
  workflow_dispatch:
  # A newly published advisory against an existing dependency produces no commit and
  # no PR, so nothing would run the audit. A weekly run catches that, and also catches
  # drift in the pinned toolchain and E2E environment.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Fails on any production advisory that is not explicitly triaged, and also on
      # a triaged entry that no longer applies, so the allowlist cannot go stale.
      - name: Dependency audit (triaged)
        run: npm run audit:ci

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Playwright starts and stops its own preview server (see playwright.config.ts).
      - name: End-to-end tests (Playwright)
        run: npx playwright test

      # The Puppeteer script expects a server already on the E2E port (see
      # e2e/e2e-config.mjs), so start one here. Keeping the server and the test in
      # a single step avoids relying on a backgrounded process surviving between
      # steps, and redirecting its output stops the step from hanging on an open
      # stdout pipe.
      - name: End-to-end smoke tests (Puppeteer)
        run: |
          port="$(node -e "import('./e2e/e2e-config.mjs').then(m => console.log(m.PREVIEW_PORT))")"
          url="http://localhost:${port}/borderlands-loot-hub/"
          npm run preview -- --port "$port" --strictPort > preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -sfo /dev/null "$url"; then
              break
            fi
            sleep 1
          done
          if ! curl -sfo /dev/null "$url"; then
            echo "Preview server did not start within 60s." >&2
            cat preview.log >&2
            exit 1
          fi
          npm run test:e2e:puppeteer

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
