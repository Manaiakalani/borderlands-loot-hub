name: Fetch SHiFT Codes from Game8

on:
  # Scheduled runs disabled 2026-07: Cloudflare began challenging GitHub Actions
  # IPs around 2026-06-17, so game8.co returns a ~2KB challenge page instead of
  # the article. Every scheduled run since has failed, and the source has not
  # contributed a code since 2026-06-03. There is no API or key to authenticate
  # with, so the workflow is manual-only until that changes — a weekly red X for
  # an unfixable upstream block is noise, not signal.
  #
  # To retry: run manually from the Actions tab. The script still exits 1 on the
  # challenge page, which is the correct behaviour for a deliberate manual run.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-game8-codes
  cancel-in-progress: true

jobs:
  fetch-codes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Fetch Game8 codes
        run: node scripts/fetch-game8-codes.mjs
      - name: Validate build
        run: |
          npx tsc -b --noEmit
          npm run lint
          npm test
          npm run build
      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet src/data/shiftCodes.ts || echo "changes=true" >> $GITHUB_OUTPUT
      - name: Commit and push if changed
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/shiftCodes.ts
          git commit -m "🎯 Auto-update SHiFT codes from Game8"
          git pull --rebase origin main
          git push
      - name: Trigger deployment
        if: steps.git-check.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
